name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Principe du moindre privilège : le GITHUB_TOKEN ne peut que lire le dépôt.
permissions:
  contents: read

# Annule un run précédent encore en cours sur la même branche / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & tests unitaires
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances (npm ci)
        run: npm ci

      - name: Vérification statique (ESLint)
        run: npm run lint

      - name: Tests unitaires (Jest)
        run: npm test

      - name: Publication du rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
