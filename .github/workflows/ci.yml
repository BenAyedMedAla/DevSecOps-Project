name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Principe du moindre privilège : le GITHUB_TOKEN ne peut que lire le dépôt.
permissions:
  contents: read

# Annule un run précédent encore en cours sur la même branche / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & tests unitaires
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances (npm ci)
        run: npm ci

      - name: Vérification statique (ESLint)
        run: npm run lint

      - name: Tests unitaires (Jest)
        run: npm test

      - name: Publication du rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # SAST : analyse statique du code source avec Semgrep.
  # Bloquant si une règle de sévérité ERROR (= haute) est déclenchée.
  # ---------------------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Image officielle épinglée sur une version précise (pas de "latest").
    container:
      image: semgrep/semgrep:1.180.0
    permissions:
      contents: read
      security-events: write # uniquement pour publier le SARIF dans l'onglet Security
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scan Semgrep (bloquant sur sévérité ERROR)
        # --severity ERROR : ne retient que les règles de sévérité haute
        # --error          : code de sortie 1 si au moins un résultat -> job en échec
        # p/security-audit et p/nodejsscan sont indispensables : les règles
        # d'injection de commande (child_process.exec) ne sont pas incluses dans
        # p/javascript, p/nodejs ni p/expressjs (constaté lors du test de la faille volontaire).
        run: >
          semgrep scan
          --config p/javascript
          --config p/nodejs
          --config p/expressjs
          --config p/security-audit
          --config p/nodejsscan
          --config p/secrets
          --exclude node_modules --exclude coverage
          --severity ERROR
          --error
          --metrics=off
          --sarif-output=semgrep.sarif

      - name: Publication du rapport SARIF (onglet Security)
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Archivage du rapport Semgrep
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 7

  # ---------------------------------------------------------------------------
  # SCA : analyse des dépendances npm (package-lock.json) avec Trivy.
  # Bloquant si une vulnérabilité CRITICAL ou HIGH est connue.
  # ---------------------------------------------------------------------------
  sca:
    name: SCA (Trivy)
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scan Trivy du système de fichiers (bloquant sur CRITICAL/HIGH)
        # Action tierce épinglée par SHA de commit (= v0.36.0) : ses tags ont été
        # réécrits lors d'une attaque supply chain en mars 2026, un tag n'est donc
        # pas une garantie d'intégrité.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false
          format: table

  # ---------------------------------------------------------------------------
  # DAST : l'application est construite en image Docker, démarrée dans le
  # runner (environnement éphémère) puis attaquée par un scan ZAP baseline.
  # Bloquant si ZAP remonte au moins une alerte de risque High.
  # ---------------------------------------------------------------------------
  dast:
    name: DAST (OWASP ZAP)
    needs: [sast, sca]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: devsecops-tp2:${{ github.sha }}
      TARGET: http://localhost:3000
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Construction de l'image Docker
        run: docker build -t "$IMAGE" .

      - name: Démarrage de l'environnement éphémère
        # Conteneur durci : système de fichiers en lecture seule, aucune
        # capacité Linux, pas d'élévation de privilèges.
        run: >
          docker run -d --name app -p 3000:3000
          --read-only --cap-drop ALL --security-opt no-new-privileges
          "$IMAGE"

      - name: Attente de la disponibilité (/health)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$TARGET/health"; then
              echo; echo "Application prête après ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::L'application ne répond pas sur /health"
          docker logs app
          exit 1

      - name: Scan ZAP baseline
        # Action tierce épinglée par SHA (= v0.15.0), image ZAP en version fixe.
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          target: ${{ env.TARGET }}
          cmd_options: '-a'
          # Le seuil de blocage est appliqué à l'étape suivante (High uniquement).
          fail_action: false
          # Pas de création d'issue : le workflow n'a pas le droit issues: write.
          allow_issue_writing: false
          artifact_name: zap-report

      - name: Contrôle du seuil (échec si alerte High)
        run: |
          echo "Alertes ZAP par niveau de risque :"
          jq -r '[.site[].alerts[]] | group_by(.riskdesc | split(" ")[0])
                 | map("  \(.[0].riskdesc | split(" ")[0]): \(length)") | .[]' report_json.json
          HIGH=$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' report_json.json)
          if [ "$HIGH" -gt 0 ]; then
            echo "::error::ZAP a détecté $HIGH alerte(s) de risque High"
            jq -r '.site[].alerts[] | select(.riskcode == "3") | "  - \(.name) (\(.instances | length) instance(s))"' report_json.json
            exit 1
          fi
          echo "Aucune alerte High : contrôle DAST validé."

      - name: Arrêt et suppression du conteneur
        if: always()
        run: |
          docker logs app || true
          docker rm -f app || true
